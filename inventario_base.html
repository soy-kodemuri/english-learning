<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inventario - Los Propios Tacos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .table-input { max-width: 110px; }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
      <h4 class="mb-0">LOS PROPIOS TACOS — Control de Inventario</h4>
      <span class="badge bg-warning text-dark fs-6">Inventario Base</span>
    </div>
    
    <div class="card-body">
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="responsable" class="form-label fw-bold">Responsable Inventario:</label>
          <input type="text" class="form-control" id="responsable" placeholder="Nombre del colaborador">
        </div>
        <div class="col-md-6">
          <label for="buscar" class="form-label fw-bold">Buscar producto:</label>
          <input type="text" class="form-control" id="buscar" placeholder="Escribe para filtrar...">
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th scope="col" style="width: 50%;">PRODUCTOS</th>
              <th scope="col" style="width: 25%;">UNIDADES</th>
              <th scope="col" style="width: 25%;">INV. INICIAL</th>
            </tr>
          </thead>
          <tbody id="tabla-body">
          </tbody>
        </table>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-3">
        <button id="btn-limpiar" class="btn btn-outline-secondary">Limpiar Cantidades</button>
        <button id="btn-guardar" class="btn btn-success">Guardar Registro</button>
      </div>
    </div>
  </div>
</div>

<script type="module" src="/main.js"></script>
<script src="js/navbar.js"></script>
</body>
</html>
