<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Traspasos y Préstamos entre Sucursales — Los Propios Tacos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
  </style>
</head>
<body>

<div class="container my-4">
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
      <h4 class="mb-0">LOS PROPIOS TACOS — Entradas y Salidas de Sucursales</h4>
      <div>
        <button id="btn-nuevo-movimiento" class="btn btn-primary btn-sm me-2">
          ➕ Registrar Movimiento
        </button>
        <button id="btn-recargar" class="btn btn-outline-light btn-sm">🔄 Recargar</button>
      </div>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-hover table-bordered align-middle">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>FECHA</th>
              <th>TIPO</th>
              <th>SUCURSAL</th>
              <th>INSUMO</th>
              <th>CANTIDAD</th>
              <th>OBSERVACIÓN</th>
              <th>ACCIONES</th>
            </tr>
          </thead>
          <tbody id="tabla-movimientos-body">
            <!-- Renderizado dinámico por JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- MODAL: Crear / Editar Movimiento de Sucursal -->
<div class="modal fade" id="modalMovimiento" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="form-movimiento">
        <input type="hidden" id="movimiento-id" value="">

        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="modalMovimientoLabel">Registrar Movimiento</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-bold">Tipo de Operación:</label>
            <select class="form-select" id="movimiento-tipo" required>
              <option value="SALIDA">SALIDA — Prestamos a sucursal (Nos resta stock)</option>
              <option value="ENTRADA">ENTRADA — Nos prestan / Recibimos (Nos suma stock)</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Sucursal Origen / Destino:</label>
            <input type="text" class="form-control" id="movimiento-sucursal" placeholder="Ej. Sucursal Poblado, Laureles, etc." required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Insumo:</label>
            <select class="form-select" id="movimiento-insumo" required>
              <option value="" disabled selected>Seleccione un insumo...</option>
              <!-- Opciones dinámicas -->
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Cantidad:</label>
            <input type="number" step="any" min="0.01" class="form-control" id="movimiento-cantidad" placeholder="Ej. 1000" required>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Observación / Nota:</label>
            <textarea class="form-control" id="movimiento-observacion" rows="2" placeholder="Ej. Préstamo urgente de birria por falta de stock"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar Movimiento</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="./js/main_movimientos.js"></script>
<script src="js/navbar.js"></script>
</body>
</html>
